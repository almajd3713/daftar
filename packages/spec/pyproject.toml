[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "daftar-spec"
version = "0.1.0"
description = "Validator for the Daftar app spec"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dependencies = ["jsonschema>=4.23,<5"]

[tool.hatch.build.targets.wheel]
packages = ["python/daftar_spec"]

[tool.hatch.build.targets.wheel.force-include]
"schema/daftar.spec.schema.json" = "daftar_spec/schema/daftar.spec.schema.json"
