[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "daftar-worker"
version = "0.1.0"
description = "Daftar worker: reads, analyses, exports and diffs workbooks"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dependencies = ["daftar-spec", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[tool.uv.sources]
daftar-spec = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/daftar_worker"]
