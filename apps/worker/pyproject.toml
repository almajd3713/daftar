[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "daftar-worker"
version = "0.1.0"
description = "Daftar worker: reads, analyses, exports and diffs workbooks"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dependencies = [
    "daftar-spec",
    "defusedxml>=0.7,<1",
    "fastapi>=0.115,<1",
    "formualizer==0.13.0",
    "olefile>=0.47,<1",
    "openpyxl==3.1.5",
    "python-multipart>=0.0.20,<1",
    "rapidfuzz>=3.9,<4",
    "uvicorn>=0.30,<1",
    "tzdata>=2025.2",
    "xlrd>=2.0,<3",
    "xlsxwriter>=3.2,<4",
]

[project.scripts]
daftar = "daftar_worker.cli:main"

[tool.uv.sources]
daftar-spec = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/daftar_worker"]
