name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # First: the runtime imports the built spec package.
      - run: pnpm -r build
      - run: pnpm -r lint
      - run: pnpm -r typecheck
      # The round-trip tests drive the real worker, not a stand-in.
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - name: Start the worker
        run: |
          nohup uv run uvicorn daftar_worker.app:app --host 127.0.0.1 --port 8765 > worker.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8765/healthz && break || sleep 1; done
      - run: pnpm -r test
        env:
          DAFTAR_TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5434/postgres
          DAFTAR_TEST_WORKER_URL: http://127.0.0.1:8765

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run mypy
      - run: uv run pytest
      - name: Validate the example specs
        run: uv run python -m daftar_spec packages/spec/examples/*.spec.json

  worker-image-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --target test -f apps/worker/Dockerfile -t daftar-worker-test .
      # Includes the conversion tests, which a missing soffice fails rather than skips.
      - run: docker run --rm daftar-worker-test

  dev-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Write a throwaway .env
        run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 16)/" .env
      - run: docker compose -f compose.dev.yaml build
      - run: docker compose -f compose.dev.yaml up -d --wait
      - name: LibreOffice is in the worker image
        run: docker compose -f compose.dev.yaml exec -T worker soffice --version
      - name: The daftar command is in the worker image
        run: docker compose -f compose.dev.yaml exec -T worker daftar --help
      - name: The schema ships in the worker image
        run: docker compose -f compose.dev.yaml exec -T worker python -c "import daftar_spec; daftar_spec.load_schema()"
      - if: always()
        run: docker compose -f compose.dev.yaml down -v

  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: deploy/build-images.sh e2e
      # A clean machine's first start, owner setup, then backup, wipe and restore.
      - run: uv run python deploy/e2e.py --tag e2e
