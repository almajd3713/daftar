[project]
name = "daftar-monorepo"
version = "0.0.0"
description = "Workspace root: installs every Python package so plain `uv run` works from here"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dependencies = ["daftar-spec", "daftar-worker"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/worker", "packages/spec"]

[tool.uv.sources]
daftar-spec = { workspace = true }
daftar-worker = { workspace = true }

[dependency-groups]
dev = ["httpx2>=2.12,<3", "ironcalc==0.9.1", "mypy>=1.13,<3", "pytest>=8,<10", "ruff>=0.8,<1", "types-jsonschema>=4.23", "msoffcrypto-tool>=6,<7", "xlsxwriter>=3.2,<4", "xlwt>=1.3,<2"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["research_notes"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["daftar_spec", "daftar_worker"]
lines-after-imports = 2

[tool.mypy]
python_version = "3.12"
strict = true
files = ["packages/spec/python", "packages/spec/tests", "apps/worker/src", "apps/worker/tests"]
mypy_path = "apps/worker/tests"

[[tool.mypy.overrides]]
module = ["ironcalc.*", "defusedxml.*", "msoffcrypto.*", "olefile.*", "openpyxl.*", "xlrd.*", "xlsxwriter.*", "xlwt.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = ["libreoffice: needs soffice; skipped locally, required in the worker test image"]
testpaths = ["packages/spec/tests", "apps/worker/tests"]
addopts = "--import-mode=importlib"
pythonpath = ["apps/worker/tests"]
