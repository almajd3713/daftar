# Dev stack: cp .env.example .env, fill in the blanks, then docker compose -f compose.dev.yaml up --build
name: daftar-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: daftar
      POSTGRES_DB: daftar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DAFTAR_DEV_DB_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daftar -d daftar"]
      interval: 5s
      timeout: 3s
      retries: 10

  # No published port: C-4 keeps the worker on the Compose network.
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      DAFTAR_DATABASE_URL: ${DAFTAR_DATABASE_URL:-}
      DAFTAR_DEFAULT_LOCALE: ${DAFTAR_DEFAULT_LOCALE:-fr-DZ}
      DAFTAR_TZ: ${DAFTAR_TZ:-Africa/Algiers}
      DAFTAR_LLM_BASE_URL: ${DAFTAR_LLM_BASE_URL:-}
      DAFTAR_LLM_MODEL: ${DAFTAR_LLM_MODEL:-}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
